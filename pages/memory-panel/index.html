<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆管理</title>
<style>
  html, body { margin: 0; height: 100%; background: #f5f5f7; font-family: -apple-system, "PingFang SC", sans-serif; }
  #frame { width: 100%; height: 100%; border: 0; display: none; }
  #fallback {
    height: 100%; display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; color: #6e6e73; font-size: 14px;
  }
  #fallback a { color: #0a84ff; text-decoration: none; }
  .spinner {
    width: 28px; height: 28px; border: 3px solid #d2d2d7; border-top-color: #0a84ff;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="fallback">
  <div class="spinner"></div>
  <div id="msg">记忆管理面板启动中…</div>
</div>
<iframe id="frame" title="记忆管理面板"></iframe>
<script>
  // 面板地址跟随当前 dashboard 的 hostname：远程访问 AstrBot 时也能连对
  const panelUrl = `${location.protocol}//${location.hostname}:8125`;
  const frame = document.getElementById("frame");
  const msg = document.getElementById("msg");
  let attempts = 0;

  async function tryLoad() {
    attempts += 1;
    try {
      const resp = await fetch(panelUrl, { method: "GET", mode: "no-cors" });
      frame.src = panelUrl;
      frame.style.display = "block";
      document.getElementById("fallback").style.display = "none";
    } catch {
      if (attempts < 60) {
        setTimeout(tryLoad, 1000);
      } else {
        document.querySelector(".spinner").style.display = "none";
        msg.innerHTML = `面板未就绪。请确认插件已启用内嵌管理面板，或直接访问 <a href="${panelUrl}" target="_blank">${panelUrl}</a>`;
      }
    }
  }
  tryLoad();
</script>
</body>
</html>
